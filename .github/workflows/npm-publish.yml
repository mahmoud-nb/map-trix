name: "🚀 release"

on:
    push:
        branches:
          - master

jobs:
    release:
        name: 🚀 release
        runs-on: ubuntu-latest
        permissions:
            contents: read
        steps:
            - name: 📚 checkout
              uses: actions/checkout@v4
            - name: 🟢 node
              uses: actions/setup-node@v4
              with:
                  node-version: 20
                  registry-url: https://registry.npmjs.org
                  cache: npm
            - name: 📦 install
              run: npm ci
            - name: 🔎 lint
              run: npm run lint
            - name: 🧪 type check
              run: npm run tsc
            - name: 🏗️ build
              run: npm run build
            - name: 🚀 publish
              run: npm publish --access public
              env:
                  NODE_AUTH_TOKEN: ${{ secrets.NPM_AUTH_TOKEN }}
